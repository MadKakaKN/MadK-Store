name: Continuous Deployment (CD)

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  test-and-verify:
    name: Test & Quality Gate
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup .NET 8
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 8.0.x

      - name: Run Backend Tests
        run: |
          dotnet restore backend/MadK.sln
          dotnet build backend/MadK.sln --no-restore --configuration Release
          dotnet test backend/MadK.sln --no-build --configuration Release

      - name: Setup Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install Frontend Dependencies & Lint
        working-directory: frontend
        run: |
          npm ci
          npm run lint
          npm run build

  deploy-to-vps:
    name: Auto Deploy to Production VPS
    needs: test-and-verify
    runs-on: ubuntu-latest
    if: github.ref == 'refs/heads/main'
    steps:
      - name: Execute Deployment on Remote VPS via SSH
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USERNAME || 'root' }}
          key: ${{ secrets.VPS_SSH_KEY }}
          passphrase: ${{ secrets.VPS_SSH_PASSPHRASE || '' }}
          port: ${{ secrets.VPS_SSH_PORT || 22 }}
          script: |
            echo "🚀 Kết nối thành công tới VPS. Đang thực thi quy trình tự động cập nhật..."
            cd /opt/madk-store
            chmod +x ./scripts/deploy.sh ./scripts/backup-db.sh
            ./scripts/deploy.sh
