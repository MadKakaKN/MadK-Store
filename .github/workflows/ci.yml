name: CI

on:
  push:
    branches: [main, "phase-*", "feat/*"]
  pull_request:
    branches: [main]

jobs:
  backend:
    name: Backend CI (.NET 8)
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Setup .NET 8
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 8.0.x

      - name: Restore dependencies
        run: dotnet restore backend/MadK.sln

      - name: Build
        run: dotnet build backend/MadK.sln --no-restore --configuration Release

      - name: Test
        run: dotnet test backend/MadK.sln --no-build --configuration Release --verbosity normal

  frontend:
    name: Frontend CI (Node 20 / Vite)
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        working-directory: frontend
        run: npm ci

      - name: Lint
        working-directory: frontend
        run: npm run lint

      - name: Build
        working-directory: frontend
        run: npm run build
