services:
  reverse-proxy:
    image: nginx:1.27-alpine
    container_name: madk-proxy
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
      - ./nginx/conf.d:/etc/nginx/conf.d:ro
      - ./certbot/conf:/etc/nginx/ssl:ro
      - ./certbot/www:/var/www/certbot:ro
    depends_on:
      api:
        condition: service_healthy
      frontend:
        condition: service_started
    restart: always

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: madk-frontend
    restart: always

  api:
    build:
      context: ./backend
      dockerfile: src/MadK.API/Dockerfile
    container_name: madk-api
    environment:
      - ASPNETCORE_ENVIRONMENT=Production
      - AppSettings__SiteUrl=https://madk.store
      - ConnectionStrings__DefaultConnection=Host=postgres;Port=5432;Database=madkstore_prod;Username=madkstore;Password=${POSTGRES_PASSWORD}
      - ConnectionStrings__Redis=redis:6379,password=${REDIS_PASSWORD:-}
      - Jwt__Key=${JWT_SECRET_KEY}
      - Jwt__Issuer=MadKStore
      - Jwt__Audience=MadKStoreClient
      - Cors__AllowedOrigins__0=https://madk.store
      - Cors__AllowedOrigins__1=https://www.madk.store
      - Vnpay__TmnCode=${VNPAY_TMN_CODE}
      - Vnpay__HashSecret=${VNPAY_HASH_SECRET}
      - Vnpay__ReturnUrl=https://madk.store/checkout/vnpay-return
      - EmailSettings__Host=${SMTP_HOST:-smtp.sendgrid.net}
      - EmailSettings__Port=${SMTP_PORT:-587}
      - EmailSettings__Username=${SMTP_USERNAME:-}
      - EmailSettings__Password=${SMTP_PASSWORD:-}
      - EmailSettings__EnableSsl=true
      - RabbitMq__Enabled=true
      - RabbitMq__HostName=rabbitmq
      - RabbitMq__Port=5672
      - RabbitMq__UserName=madkstore
      - RabbitMq__Password=${RABBITMQ_PASSWORD}
      - Sentry__Dsn=${SENTRY_DSN:-}
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "curl -f http://localhost:8080/health || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 3
      start_period: 20s
    restart: always

  postgres:
    image: postgres:16-alpine
    container_name: madk-postgres
    environment:
      POSTGRES_DB: madkstore_prod
      POSTGRES_USER: madkstore
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    volumes:
      - postgres_prod_data:/var/lib/postgresql/data
      - ./backups:/backups
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U madkstore -d madkstore_prod"]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: always

  redis:
    image: redis:7-alpine
    container_name: madk-redis
    command: ["redis-server", "--appendonly", "yes", "--requirepass", "${REDIS_PASSWORD:-}"]
    volumes:
      - redis_prod_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: always

  rabbitmq:
    image: rabbitmq:3-alpine
    container_name: madk-rabbitmq
    environment:
      RABBITMQ_DEFAULT_USER: madkstore
      RABBITMQ_DEFAULT_PASS: ${RABBITMQ_PASSWORD}
    volumes:
      - rabbitmq_prod_data:/var/lib/rabbitmq
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "ping"]
      interval: 15s
      timeout: 5s
      retries: 5
    restart: always

  db-backup:
    image: postgres:16-alpine
    container_name: madk-db-backup
    volumes:
      - ./backups:/backups/postgresql
      - ./scripts/backup-db.sh:/usr/local/bin/backup-db.sh:ro
    environment:
      - POSTGRES_DB=madkstore_prod
      - POSTGRES_USER=madkstore
      - PGPASSWORD=${POSTGRES_PASSWORD}
      - DB_HOST=postgres
      - RETENTION_DAYS=30
    entrypoint: |
      /bin/sh -c "
      chmod +x /usr/local/bin/backup-db.sh &&
      echo '0 2 * * * /usr/local/bin/backup-db.sh >> /var/log/cron.log 2>&1' > /etc/crontabs/root &&
      crond -f -l 2
      "
    depends_on:
      postgres:
        condition: service_healthy
    restart: always

volumes:
  postgres_prod_data:
  redis_prod_data:
  rabbitmq_prod_data:
