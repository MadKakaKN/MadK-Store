# ==============================================================================
# Render.com Blueprint - MadK Store Backend API (.NET 8 + Docker)
# Miễn phí 100% trên Render Free Tier
# ==============================================================================
services:
  - type: web
    name: madk-api
    runtime: docker
    dockerfilePath: ./backend/src/MadK.API/Dockerfile
    dockerContext: ./backend
    plan: free
    region: singapore
    healthCheckPath: /health
    envVars:
      - key: ASPNETCORE_ENVIRONMENT
        value: Production
      - key: ConnectionStrings__DefaultConnection
        sync: false # Nhập connection string PostgreSQL từ Neon.tech hoặc Supabase
      - key: ConnectionStrings__Redis
        value: disabled
      - key: RabbitMq__Enabled
        value: "false"
      - key: Jwt__Issuer
        value: MadKStore
      - key: Jwt__Audience
        value: MadKStoreClient
      - key: Jwt__Key
        generateValue: true # Render tự động sinh chuỗi bí mật ngẫu nhiên bảo mật
      - key: AppSettings__SiteUrl
        value: https://mad-k-store.vercel.app
      - key: Cors__AllowedOrigins__0
        value: https://mad-k-store.vercel.app
      - key: Cors__AllowedOrigins__1
        value: http://localhost:5173
      - key: SMTP_HOST
        value: smtp.gmail.com
      - key: SMTP_PORT
        value: "587"
      - key: SMTP_USERNAME
        value: hk641080@gmail.com
      - key: SMTP_PASSWORD
        value: ptspuajqmmzvggih
      - key: SMTP_ENABLE_SSL
        value: "true"
      - key: SMTP_FROM_EMAIL
        value: hk641080@gmail.com
      - key: SMTP_FROM_NAME
        value: MadK Store
      - key: SMTP_USE_MOCK
        value: "false"
