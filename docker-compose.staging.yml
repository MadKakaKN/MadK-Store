services:
  reverse-proxy:
    image: nginx:1.27-alpine
    container_name: madk-staging-proxy
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
      - ./nginx/conf.d:/etc/nginx/conf.d:ro
      - ./certbot/conf:/etc/nginx/ssl:ro
      - ./certbot/www:/var/www/certbot:ro
    depends_on:
      api:
        condition: service_healthy
      frontend:
        condition: service_started
    restart: always

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: madk-staging-frontend
    restart: always

  api:
    build:
      context: ./backend
      dockerfile: src/MadK.API/Dockerfile
    container_name: madk-staging-api
    environment:
      - ASPNETCORE_ENVIRONMENT=Staging
      - AppSettings__SiteUrl=https://staging.madk.store
      - ConnectionStrings__DefaultConnection=Host=postgres;Port=5432;Database=madkstore_staging;Username=madkstore;Password=${POSTGRES_PASSWORD}
      - ConnectionStrings__Redis=redis:6379
      - Jwt__Key=${JWT_SECRET_KEY}
      - Jwt__Issuer=MadKStoreStaging
      - Jwt__Audience=MadKStoreStagingClient
      - Cors__AllowedOrigins__0=https://staging.madk.store
      - Cors__AllowedOrigins__1=http://localhost:5173
      - Vnpay__TmnCode=${VNPAY_TMN_CODE:-MADKTEST}
      - Vnpay__HashSecret=${VNPAY_HASH_SECRET:-MADK_VNPAY_SECRET_KEY_FOR_LOCAL_TESTING_2026}
      - Vnpay__ReturnUrl=https://staging.madk.store/checkout/vnpay-return
      - EmailSettings__Host=mailpit
      - EmailSettings__Port=1025
      - RabbitMq__Enabled=true
      - RabbitMq__HostName=rabbitmq
      - RabbitMq__Port=5672
      - RabbitMq__UserName=madkstore
      - RabbitMq__Password=${RABBITMQ_PASSWORD:-madkstore_staging_pwd}
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
      mailpit:
        condition: service_started
    healthcheck:
      test: ["CMD-SHELL", "curl -f http://localhost:8080/health || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 3
    restart: always

  postgres:
    image: postgres:16-alpine
    container_name: madk-staging-postgres
    environment:
      POSTGRES_DB: madkstore_staging
      POSTGRES_USER: madkstore
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    volumes:
      - postgres_staging_data:/var/lib/postgresql/data
      - ./backups:/backups
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U madkstore -d madkstore_staging"]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: always

  redis:
    image: redis:7-alpine
    container_name: madk-staging-redis
    volumes:
      - redis_staging_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: always

  rabbitmq:
    image: rabbitmq:3-management-alpine
    container_name: madk-staging-rabbitmq
    ports:
      - "15672:15672" # Management Web UI for staging inspection
    environment:
      RABBITMQ_DEFAULT_USER: madkstore
      RABBITMQ_DEFAULT_PASS: ${RABBITMQ_PASSWORD:-madkstore_staging_pwd}
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "ping"]
      interval: 15s
      timeout: 5s
      retries: 5
    restart: always

  mailpit:
    image: axllent/mailpit:latest
    container_name: madk-staging-mailpit
    ports:
      - "8025:8025" # Mailpit Web UI for staging QA email testing
    restart: always

volumes:
  postgres_staging_data:
  redis_staging_data:
